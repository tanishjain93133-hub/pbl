{% extends "base.html" %}

{% block title %}User Login — SmartPark{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="sp-card shadow-md p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="logo-badge mx-auto mb-3" style="width:48px; height:48px; font-size:1.5rem;">
                        <i class="bi bi-p-square-fill"></i>
                    </div>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-secondary small">Log in to manage your vehicle bookings and history</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" 
                                   value="{{ email or '' }}" placeholder="student@campus.edu" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label fw-semibold small mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" 
                                   placeholder="Enter your password" required>
                            <button type="button" class="btn bg-light border border-start-0" onclick="togglePassword('password', 'toggleLoginEye')">
                                <i class="bi bi-eye text-muted" id="toggleLoginEye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-sp w-100 py-2 justify-content-center mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>

                    <div class="text-center small text-secondary">
                        Don't have an account? 
                        <a href="{{ url_for('auth.register') }}" class="text-primary fw-bold text-decoration-none">Register here</a>
                    </div>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <small class="text-muted">Sample User: <code>rahul.sharma@example.com</code> / <code>User@123</code></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
