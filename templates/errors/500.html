{% extends "base.html" %}

{% block title %}500 Server Error — SmartPark{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="stat-icon-wrapper icon-amber mx-auto mb-4" style="width:80px; height:80px; font-size:2.5rem;">
            <i class="bi bi-exclamation-octagon-fill"></i>
        </div>
        <h1 class="display-5 fw-extrabold text-dark">500 Internal Server Error</h1>
        <p class="text-secondary max-w-500 mx-auto mb-4">
            An unexpected error occurred while processing your parking request. Please try again or contact the campus facility desk.
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-primary-sp px-4 py-2">
            <i class="bi bi-arrow-clockwise me-1"></i> Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
